[project]
name = "lab-seguranca-owasp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Davi Mathais", email = "100139909+cksalmeida@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
lab-seguranca-owasp = "lab_seguranca_owasp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "security: testes de seguranca ofensiva e defensiva (OWASP)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*testclient.*:Warning",
]
